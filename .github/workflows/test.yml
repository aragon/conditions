name: CI

permissions: {}

# Triggers are arranged so each commit produces exactly one CI run:
# - push to main always runs (post-merge or direct push)
# - pull_request events always run (PRs always have CI before merge)
# - feature-branch pushes outside a PR don't trigger anything

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

env:
    FOUNDRY_PROFILE: ci

jobs:
    ci:
        name: Foundry project + ABI freshness
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.5.1

            - name: Install just
              uses: extractions/setup-just@v2

            - name: Show Forge version
              run: forge --version

            - name: Run Forge fmt
              run: forge fmt --check

            - name: Run Forge build
              run: forge build --sizes

            - name: Run Forge tests
              run: forge test -vvv --no-match-path '**/fork/**'

            - name: Verify ABI is in sync with contracts
              run: |
                  (cd npm-artifacts && just abi)
                  if ! git diff --exit-code -- npm-artifacts/src/abi.ts; then
                    echo "::error::npm-artifacts/src/abi.ts is out of date."
                    echo "::error::Run 'just abi' from npm-artifacts/ locally and commit the diff."
                    exit 1
                  fi
